<!DOCTYPE html>
<html lang="en">

<head>
    <title>More Complicated Grid</title>
    <style>
        .container {
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            height: 500px;
            margin: 0 auto;
            gap: 10px;
        }

        .left {
            background-color: red;
            display: grid;
            align-items: center;
        }

        h1 {
            text-align: center;
        }

        .right {
            background-color: blue;
            display: grid;
            align-items: center;
            grid-template-columns: 1fr 1fr 1fr;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="left">
            <h1>Left</h1>
            <p>text text text text text text text text text text text text</p>
        </div>
        <div class="right">
            <h2>Col 1</h2>
            <h2>Col 2</h2>
            <h2>Col 3</h2>
            <h2>Col 1</h2>
            <h2>Col 2</h2>
            <h2>Col 3</h2>
            <h2>Col 1</h2>
            <h2>Col 2</h2>
            <h2>Col 3</h2>
        </div>
    </div>

</body>

</html>
