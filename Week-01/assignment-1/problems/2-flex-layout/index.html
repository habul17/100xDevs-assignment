<!DOCTYPE html>
<html lang="en">

<head>
    <title>Flex Layout</title>
    <style>
        .container {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            height: 500px;
        }

        .left {
            background-color: red;
            flex: 1;
            display: flex;
            align-items: center;

        }

        .right {
            background-color: blue;
            flex: 2;
            display: flex;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="left">
            <h1>Left</h1>
        </div>
        <div class="right">
            <h1>Right</h1>
        </div>

    </div>
</body>

</html>
