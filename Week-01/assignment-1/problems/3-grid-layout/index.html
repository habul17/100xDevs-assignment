<!DOCTYPE html>
<html lang="en">

<head>
    <title>Grid Layout</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            max-width: 1200px;
            margin: 0 auto;
            height: 500px;

        }

        .left {
            background-color: red;
            display: grid;
            align-items: center;
        }

        .right {
            background-color: blue;
            display: grid;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="left">
            <h1>Left</h1>
        </div>
        <div class="right">
            <h1>Right</h1>
        </div>
    </div>

</body>

</html>
